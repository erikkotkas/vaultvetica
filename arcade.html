<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="room.css">
  <link rel="stylesheet" href="general.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="context-menu.css">
  <link rel="stylesheet" href="https://use.typekit.net/bao6qio.css">
  <title>VaultVetica</title>
</head>
<body>
  <div id="page-fade" class="is-active"></div>

  <aside id="context-menu" class="context-menu">
    <div class="context-menu-header">
      <div class="context-menu-title" id="ctx-title"></div>
    </div>
    <div class="context-menu-link">Links to: <span id="ctx-link-label"></span></div>
    <div class="context-menu-desc" id="ctx-desc"></div>
  </aside>

  <header class="header">
    <div class="left-section">
      <button onclick="back()" class="back">&larr; Back</button>
    </div>
    <div class="right-section">
      <button class="btn map-button" type="button" aria-label="Open map">
        Map <img class="map-button-icon" src="images/compass-icon.svg" alt="">
      </button>
    </div>
  </header>

  <div class="background-container">
    <img class="bunker-background" src="images/room_shell_tnl_right@2x.png">

    <!-- r5_machine_left.png -->
    <div class="asset-container ctx-trigger"
         style="left:15.22%;top:30.64%;width:16.48%;"
         onmouseenter="openContext({ name: 'DIALED', linkLabel: 'dialed.gg', desc: 'Humans can\'t reliably recall colours. This is a simple game to see how good and bad you are at it.', url: 'https://dialed.gg' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r5_machine_left.png" alt="Arcade machine left">
      <span class="glint" style="mask-image: url('images/r5_machine_left.png')"></span>
      <div class="tool-tip">DIALED</div>
    </div>

    <!-- r5_painting.png -->
    <div class="asset-container ctx-trigger"
         style="left:37.88%;top:32.54%;width:12.28%;"
         onmouseenter="openContext({ name: 'DESIGNER\'S EYE', linkLabel: 'avark.agency', desc: 'This game is very simple. There are ten levels created to test your design eye.', url: 'https://avark.agency/designers-eye?playagain=' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r5_painting.png" alt="Painting">
      <span class="glint" style="mask-image: url('images/r5_painting.png')"></span>
      <div class="tool-tip">DESIGNER'S EYE</div>
    </div>

    <!-- r5_table.png -->
    <div class="asset-container ctx-trigger"
         style="left:34.14%;top:61.23%;width:19.17%;"
         onmouseenter="openContext({ name: 'METHOD OF ACTION', linkLabel: 'type.method.ac', desc: 'Test your kerning skills and improve your typography.', url: 'https://type.method.ac' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r5_table.png" alt="Table">
      <span class="glint" style="mask-image: url('images/r5_table.png')"></span>
      <div class="tool-tip">METHOD OF ACTION</div>
    </div>

    <!-- r5_machine_right.png -->
    <div class="asset-container ctx-trigger"
         style="left:56.87%;top:28.75%;width:14.45%;"
         onmouseenter="openContext({ name: 'CAN\'T UNSEE', linkLabel: 'cantunsee.space', desc: 'See how good your eye for design is with Can\'t Unsee.', url: 'https://cantunsee.space' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r5_machine_right.png" alt="Arcade machine right">
      <span class="glint" style="mask-image: url('images/r5_machine_right.png')"></span>
      <div class="tool-tip">CAN'T UNSEE</div>
    </div>

  </div>
  <img class="ground" src="images/ground rooms.png" alt="">

  <script>
    window.CURRENT_ROOM = 5;

    const fade = document.getElementById("page-fade");

    window.addEventListener("pageshow", (event) => {
      if (event.persisted) {
        fade.style.transition = "none";
        fade.classList.remove("is-active");
        fade.offsetHeight;
        fade.style.transition = "";
        return;
      }
      setTimeout(() => { fade.classList.remove("is-active"); }, 100);
    });

    function fadeToPage(url) {
      sessionStorage.setItem("fade-transition", "true");
      fade.style.transition = "";
      fade.classList.add("is-active");
      setTimeout(() => { window.location.href = url; }, 500);
    }

    function back() { fadeToPage("index.html"); }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') fadeToPage('index.html');
    });
  </script>
  <script src="config.js"></script>
  <script src="context-menu.js"></script>
  <script src="nav.js"></script>
</body>
</html>
