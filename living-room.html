<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="room.css">
  <link rel="stylesheet" href="general.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="context-menu.css">
  <link rel="stylesheet" href="https://use.typekit.net/bao6qio.css">
  <title>VaultVetica</title>
  <link rel="icon" href="images/vv_favicon.png" type="image/png">
  <style>
    .tv-unit-asset .asset-img {
      transform: none !important;
      transition: none !important;
    }
    .tv-unit-asset { cursor: pointer; }
    #tv-screen-wrap {
      position: absolute;
      left: 50.34%;
      top: 30.82%;
      width: 17.14%;
      aspect-ratio: 227.58 / 147.82;
      z-index: 1;
      overflow: hidden;
    }
    .asset-container:hover {
      z-index: 50;
    }
  </style>
</head>

<body>
  <div id="page-fade" class="is-active"></div>

  <aside id="context-menu" class="context-menu">
    <div class="context-menu-header">
      <div class="context-menu-title" id="ctx-title"></div>
    </div>
    <div class="context-menu-link">Links to: <span id="ctx-link-label"></span></div>
    <div class="context-menu-desc" id="ctx-desc"></div>
  </aside>

  <header class="header">
    <div class="left-section">
      <button onclick="back()" class="back">&larr; Back</button>
    </div>
    <div class="right-section">
      <button class="btn map-button" type="button" aria-label="Open map">
        Map <img class="map-button-icon" src="images/compass-icon.svg" alt="">
      </button>
    </div>
  </header>

  <div class="background-container">

    <img class="bunker-background" src="images/room_shell_tnl_left@2x.png">

    <!-- Clock (clickable) -->
    <div class="asset-container ctx-trigger"
         style="left: 35.70%; top: 28.76%; width: 5.71%;"
         onmouseenter="openContext({ name: 'POMOFOCUS', linkLabel: 'pomofocus.io', desc: 'A customizable pomodoro timer that works on desktop & mobile browser. The aim of this app is to help you focus on any task you are working on.', url: 'https://pomofocus.io' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r4_clock.png">
      <span class="glint" style="mask-image: url('images/r4_clock.png')"></span>
      <div class="tool-tip">POMOFOCUS</div>
    </div>

    <!-- Picture frame (clickable) -->
    <div class="asset-container ctx-trigger"
         style="left: 34.27%; top: 42.44%; width: 8.57%;"
         onmouseenter="openContext({ name: 'BEHANCE', linkLabel: 'behance.net', desc: 'Adobe\'s design community sharing design projects.', url: 'https://www.behance.net' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r4_picture_frame.png">
      <span class="glint" style="mask-image: url('images/r4_picture_frame.png')"></span>
      <div class="tool-tip">BEHANCE</div>
    </div>

    <!-- Bottle shelf left (clickable) -->
    <div class="asset-container ctx-trigger"
         style="left: 32.13%; top: 56.13%; width: 10.71%;"
         onmouseenter="openContext({ name: 'HOVER STATES', linkLabel: 'hoverstat.es', desc: 'Browse our growing archive of web design inspiration which we have been curating since 2012.', url: 'https://www.hoverstat.es' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r4_shelf_left.png">
      <span class="glint" style="mask-image: url('images/r4_shelf_left.png')"></span>
      <div class="tool-tip">HOVER STATES</div>
    </div>

    <!-- TV screen -->
    <div id="tv-screen-wrap">
      <canvas id="tv-canvas" style="width:100%;height:100%;display:block;image-rendering:pixelated;"></canvas>
    </div>
    <video id="tv-video" src="https://pub-5cf2bf8e348646f1b9badb4734896200.r2.dev/topgear_480p.mp4" style="display:none;" muted loop playsinline preload="auto"></video>

    <!-- TV unit (clickable - toggles sound) -->
    <div id="tv-unit" class="asset-container tv-unit-asset"
         style="left: 46.42%; top: 27.37%; width: 25.00%; z-index: 2;"
         onclick="toggleTV()">
      <img class="asset-img" src="images/r4_tv_unit.png">
    </div>

    <!-- Right shelf (decoration only) -->
    <div class="asset-container no-click"
         style="left: 73.57%; top: 21.90%; width: 10.00%;">
      <img class="asset-img" src="images/r4_shelf_right.png">
    </div>

    <!-- Beer table (clickable) -->
    <div class="asset-container ctx-trigger"
         style="left: 71.43%; top: 67.07%; width: 10.00%;"
         onmouseenter="openContext({ name: 'GRADIENT CHECKLIST', linkLabel: 'akx.github.io', desc: 'UX, UI & Web Design Checklists for Designers.', url: 'https://akx.github.io/gradient/' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r4_table.png">
      <span class="glint" style="mask-image: url('images/r4_table.png')"></span>
      <div class="tool-tip">GRADIENT CHECKLIST</div>
    </div>

    <!-- Sofa + man (decoration only) -->
    <div class="asset-container no-click"
         style="left: 47.84%; top: 56.13%; width: 22.15%; z-index: 3;">
      <img class="asset-img" src="images/r4_sofa.png">
    </div>

  </div>
  <img class="ground" src="images/ground rooms.png" alt="">

<script>
  window.CURRENT_ROOM = 4;

  const fade = document.getElementById("page-fade");

  window.addEventListener("pageshow", (event) => {
    if (event.persisted) {
      fade.style.transition = "none";
      fade.classList.remove("is-active");
      fade.offsetHeight;
      fade.style.transition = "";
      return;
    }
    setTimeout(() => { fade.classList.remove("is-active"); }, 100);
  });

  function fadeToPage(url) {
    sessionStorage.setItem("fade-transition", "true");
    fade.style.transition = "";
    fade.classList.add("is-active");
    setTimeout(() => { window.location.href = url; }, 500);
  }

  function back() { fadeToPage("index.html"); }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') fadeToPage('index.html');
  });

  (function() {
    const video = document.getElementById('tv-video');
    const canvas = document.getElementById('tv-canvas');
    const ctx = canvas.getContext('2d');
    const PIXEL_SCALE = 0.15;

    function startDrawing() {
      function drawFrame() {
        if (!video.paused && !video.ended) {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        }
        requestAnimationFrame(drawFrame);
      }
      drawFrame();
    }

    video.addEventListener('loadedmetadata', function() {
      video.volume = 0.65;
      canvas.width = Math.floor(video.videoWidth * PIXEL_SCALE);
      canvas.height = Math.floor(video.videoHeight * PIXEL_SCALE);

      const randomTime = Math.random() * video.duration;
      const seekTimeout = setTimeout(function() {
        video.play().catch(function(){});
        startDrawing();
      }, 2000);

      video.addEventListener('seeked', function() {
        clearTimeout(seekTimeout);
        video.play().catch(function(){});
        startDrawing();
      }, { once: true });

      video.currentTime = randomTime;
    });

    window.toggleTV = function() {
      video.muted = !video.muted;
    };
  })();
</script>
  <script src="config.js"></script>
  <script src="context-menu.js"></script>
  <script src="nav.js"></script>
</body>
</html>
