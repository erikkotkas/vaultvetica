<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="room.css">
  <link rel="stylesheet" href="general.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="context-menu.css">
  <link rel="stylesheet" href="https://use.typekit.net/bao6qio.css">
  <title>VaultVetica</title>
  <link rel="icon" href="images/vv_favicon.png" type="image/png">
</head>
<body>
  <div id="page-fade" class="is-active"></div>

  <aside id="context-menu" class="context-menu">
    <div class="context-menu-header">
      <div class="context-menu-title" id="ctx-title"></div>
    </div>
    <div class="context-menu-link">Links to: <span id="ctx-link-label"></span></div>
    <div class="context-menu-desc" id="ctx-desc"></div>
  </aside>

  <header class="header">
    <div class="left-section">
      <button onclick="back()" class="back">&larr; Back</button>
    </div>
    <div class="right-section">
      <button class="btn map-button" type="button" aria-label="Open map">
        Map <img class="map-button-icon" src="images/compass-icon.svg" alt="">
      </button>
    </div>
  </header>

  <div class="background-container">
    <img class="bunker-background" src="images/room_shell_tnl_right@2x.png">

    <!-- r9_bar.png -->
    <div class="asset-container ctx-trigger"
         style="left:9.29%;top:24.66%;width:25.71%;"
         onmouseenter="openContext({ name: 'THE NOUN PROJECT', linkLabel: 'thenounproject.com', desc: 'The world\'s largest and most diverse collection of high-quality vector icons and photos. Crafted and curated by real human Creators.', url: 'https://thenounproject.com/' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r9_bar.png" alt="Pub bar">
      <span class="glint" style="mask-image: url('images/r9_bar.png')"></span>
      <div class="tool-tip">THE NOUN PROJECT</div>
    </div>

    <!-- r9_sign.png -->
    <div class="asset-container ctx-trigger"
         style="left:59.29%;top:17.12%;width:18.57%;"
         onmouseenter="openContext({ name: 'HERO ICONS', linkLabel: 'heroicons.com', desc: 'Beautiful hand-crafted SVG icons, by the makers of Tailwind CSS.', url: 'https://heroicons.com/' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r9_sign.png" alt="Pub sign">
      <span class="glint" style="mask-image: url('images/r9_sign.png')"></span>
      <div class="tool-tip">HERO ICONS</div>
    </div>

    <!-- r9_jukebox.png -->
    <div class="asset-container ctx-trigger"
         style="left:37.86%;top:41.09%;width:17.14%;"
         onmouseenter="openContext({ name: 'PHOSPHOR ICONS', linkLabel: 'phosphoricons.com', desc: 'Phosphor is a flexible icon family for interfaces, diagrams, presentations — whatever, really.', url: 'https://phosphoricons.com/' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r9_jukebox.png" alt="Jukebox">
      <span class="glint" style="mask-image: url('images/r9_jukebox.png')"></span>
      <div class="tool-tip">PHOSPHOR ICONS</div>
    </div>

    <!-- r9_barrels.png -->
    <div class="asset-container ctx-trigger"
         style="left:58.57%;top:56.17%;width:13.57%;"
         onmouseenter="openContext({ name: 'EXPERIENCE JAPAN', linkLabel: 'experience-japan.info', desc: 'A beautiful array of Japanese pictograms.', url: 'https://experience-japan.info/' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r9_barrels.png" alt="Barrels">
      <span class="glint" style="mask-image: url('images/r9_barrels.png')"></span>
      <div class="tool-tip">EXPERIENCE JAPAN</div>
    </div>

    <!-- r9_pukid.png (no-click) -->
    <div class="asset-container no-click"
         style="left:9.29%;top:73.97%;width:24.29%;">
      <img class="asset-img" src="images/r9_pukid.png" alt="Pukid">
    </div>

    <!-- r9_bloke@2x.png (no-click) -->
    <div class="asset-container no-click"
         style="left:78.57%;top:67.10%;width:9.29%;">
      <img class="asset-img" src="images/r9_bloke@2x.png" alt="Bloke">
    </div>

    <!-- r9_stein.png -->
    <div class="asset-container ctx-trigger"
         style="left:73.57%;top:75.33%;width:5.00%;"
         onmouseenter="openContext({ name: 'DOODLICONS', linkLabel: 'rahulbhadoriya.notion.site', desc: 'Carelessly designed Doodle icons for your next project\'s wireframe.', url: 'https://rahulbhadoriya.notion.site/Doodlicons-519314a92ed3474093a10e44946bbb72' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r9_stein.png" alt="Beer stein">
      <span class="glint" style="mask-image: url('images/r9_stein.png')"></span>
      <div class="tool-tip">DOODLICONS</div>
    </div>
  </div>
  <img class="ground" src="images/ground rooms.png" alt="">

  <script>
    window.CURRENT_ROOM = 9;

    const fade = document.getElementById("page-fade");

    window.addEventListener("pageshow", (event) => {
      if (event.persisted) {
        fade.style.transition = "none";
        fade.classList.remove("is-active");
        fade.offsetHeight;
        fade.style.transition = "";
        return;
      }
      setTimeout(() => { fade.classList.remove("is-active"); }, 100);
    });

    function fadeToPage(url) {
      sessionStorage.setItem("fade-transition", "true");
      fade.style.transition = "";
      fade.classList.add("is-active");
      setTimeout(() => { window.location.href = url; }, 500);
    }

    function back() { fadeToPage("index.html"); }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') fadeToPage('index.html');
    });
  </script>
  <script src="config.js"></script>
  <script src="context-menu.js"></script>
  <script src="nav.js"></script>
</body>
</html>
