<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="room.css">
  <link rel="stylesheet" href="general.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="context-menu.css">
  <link rel="stylesheet" href="https://use.typekit.net/bao6qio.css">
  <title>VaultVetica</title>
</head>
<body>
  <div id="page-fade" class="is-active"></div>

  <aside id="context-menu" class="context-menu">
    <div class="context-menu-header">
      <div class="context-menu-title" id="ctx-title"></div>
    </div>
    <div class="context-menu-link">Links to: <span id="ctx-link-label"></span></div>
    <div class="context-menu-desc" id="ctx-desc"></div>
  </aside>

  <header class="header">
    <div class="left-section">
      <button onclick="back()" class="back">&larr; Back</button>
    </div>
    <div class="right-section">
      <button class="btn map-button" type="button" aria-label="Open map">
        Map <img class="map-button-icon" src="images/compass-icon.svg" alt="">
      </button>
    </div>
  </header>

  <div class="background-container">
    <img class="bunker-background" src="images/room_shell_tnl_right@2x.png">

    <!-- r5_background_assets.png (no-click) -->
    <div class="asset-container no-click"
         style="left:43.55%;top:58.99%;width:55.71%;">
      <img class="asset-img" src="images/r5_background_assets.png" alt="Background assets">
    </div>

    <!-- r5_cctv_feed.png (no-click) -->
    <div class="asset-container no-click"
         style="left:21.05%;top:45.28%;width:13.57%;">
      <img class="asset-img" src="images/r5_cctv_feed.png" alt="CCTV feed">
    </div>

    <!-- r5_monitor_3.png -->
    <div class="asset-container ctx-trigger"
         style="left:37.13%;top:26.10%;width:10.00%;"
         onmouseenter="openContext({ name: 'MONITOR 3', linkLabel: 'placeholder', desc: 'Placeholder description.', url: '#' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r5_monitor_3.png" alt="Monitor 3">
      <div class="tool-tip">MONITOR 3</div>
    </div>

    <!-- r5_monitor_4.png -->
    <div class="asset-container ctx-trigger"
         style="left:55.34%;top:29.52%;width:12.14%;"
         onmouseenter="openContext({ name: 'MONITOR 4', linkLabel: 'placeholder', desc: 'Placeholder description.', url: '#' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r5_monitor_4.png" alt="Monitor 4">
      <div class="tool-tip">MONITOR 4</div>
    </div>

    <!-- r5_monitor_5.png -->
    <div class="asset-container ctx-trigger"
         style="left:25.34%;top:32.47%;width:10.71%;"
         onmouseenter="openContext({ name: 'MONITOR 5', linkLabel: 'placeholder', desc: 'Placeholder description.', url: '#' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r5_monitor_5.png" alt="Monitor 5">
      <div class="tool-tip">MONITOR 5</div>
    </div>

    <!-- r5_monitor_1.png -->
    <div class="asset-container ctx-trigger"
         style="left:38.91%;top:38.43%;width:16.43%;"
         onmouseenter="openContext({ name: 'MONITOR 1', linkLabel: 'placeholder', desc: 'Placeholder description.', url: '#' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r5_monitor_1.png" alt="Monitor 1">
      <div class="tool-tip">MONITOR 1</div>
    </div>

    <!-- r5_pinboard.png -->
    <div class="asset-container ctx-trigger"
         style="left:66.77%;top:41.86%;width:10.71%;"
         onmouseenter="openContext({ name: 'PINBOARD', linkLabel: 'placeholder', desc: 'Placeholder description.', url: '#' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r5_pinboard.png" alt="Pinboard">
      <span class="glint" style="mask-image: url('images/r5_pinboard.png')"></span>
      <div class="tool-tip">PINBOARD</div>
    </div>

    <!-- r5_monitor_2.png -->
    <div class="asset-container ctx-trigger"
         style="left:54.26%;top:48.02%;width:12.85%;"
         onmouseenter="openContext({ name: 'MONITOR 2', linkLabel: 'placeholder', desc: 'Placeholder description.', url: '#' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r5_monitor_2.png" alt="Monitor 2">
      <div class="tool-tip">MONITOR 2</div>
    </div>

    <!-- r5_computer.png -->
    <div class="asset-container ctx-trigger"
         style="left:14.63%;top:66.54%;width:9.28%;"
         onmouseenter="openContext({ name: 'COMPUTER', linkLabel: 'placeholder', desc: 'Placeholder description.', url: '#' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r5_computer.png" alt="Computer">
      <span class="glint" style="mask-image: url('images/r5_computer.png')"></span>
      <div class="tool-tip">COMPUTER</div>
    </div>

  </div>
  <img class="ground" src="images/ground rooms.png" alt="">

  <script>
    window.CURRENT_ROOM = 5;

    const fade = document.getElementById("page-fade");

    window.addEventListener("pageshow", (event) => {
      if (event.persisted) {
        fade.style.transition = "none";
        fade.classList.remove("is-active");
        fade.offsetHeight;
        fade.style.transition = "";
        return;
      }
      setTimeout(() => { fade.classList.remove("is-active"); }, 100);
    });

    function fadeToPage(url) {
      sessionStorage.setItem("fade-transition", "true");
      fade.style.transition = "";
      fade.classList.add("is-active");
      setTimeout(() => { window.location.href = url; }, 500);
    }

    function back() { fadeToPage("index.html"); }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') fadeToPage('index.html');
    });
  </script>
  <script src="context-menu.js"></script>
  <script src="nav.js"></script>
</body>
</html>
