<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="room.css">
  <link rel="stylesheet" href="general.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="context-menu.css">
  <link rel="stylesheet" href="https://use.typekit.net/bao6qio.css">
  <title>VaultVetica</title>
</head>
<body>
  <div id="page-fade" class="is-active"></div>

  <aside id="context-menu" class="context-menu">
    <div class="context-menu-header">
      <div class="context-menu-title" id="ctx-title"></div>
    </div>
    <div class="context-menu-link">Links to: <span id="ctx-link-label"></span></div>
    <div class="context-menu-desc" id="ctx-desc"></div>
  </aside>

  <header class="header">
    <div class="left-section">
      <button onclick="back()" class="back">&larr; Back</button>
    </div>
    <div class="right-section">
      <button class="btn map-button" type="button" aria-label="Open map">
        Map <img class="map-button-icon" src="images/compass-icon.svg" alt="">
      </button>
    </div>
  </header>

  <div class="background-container">
    <img class="bunker-background" src="images/room_shell_tnl_right@2x.png">

    <!-- r3_painting.png -->
    <div class="asset-container ctx-trigger"
         style="left:26.04%;top:32.15%;width:10.53%;"
         onmouseenter="openContext({ name: 'PAINTING', linkLabel: 'Placeholder', desc: 'Placeholder description.', url: '#' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r3_painting.png" alt="Painting">
      <span class="glint" style="mask-image: url('images/r3_painting.png')"></span>
      <div class="tool-tip">PAINTING</div>
    </div>

    <!-- r3_table.png -->
    <div class="asset-container ctx-trigger"
         style="left:16.11%;top:49.19%;width:22.13%;"
         onmouseenter="openContext({ name: 'TABLE', linkLabel: 'Placeholder', desc: 'Placeholder description.', url: '#' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r3_table.png" alt="Table">
      <span class="glint" style="mask-image: url('images/r3_table.png')"></span>
      <div class="tool-tip">TABLE</div>
    </div>

    <!-- r3_bookcase.png -->
    <div class="asset-container ctx-trigger"
         style="left:47.72%;top:45.77%;width:21.27%;"
         onmouseenter="openContext({ name: 'BOOKCASE', linkLabel: 'Placeholder', desc: 'Placeholder description.', url: '#' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r3_bookcase.png" alt="Bookcase">
      <span class="glint" style="mask-image: url('images/r3_bookcase.png')"></span>
      <div class="tool-tip">BOOKCASE</div>
    </div>

    <!-- r3_librarian.png -->
    <div class="asset-container ctx-trigger"
         style="left:40.25%;top:57.51%;width:10.71%;"
         onmouseenter="openContext({ name: 'LIBRARIAN', linkLabel: 'Placeholder', desc: 'Placeholder description.', url: '#' })"
         onmouseleave="closeContext()"
         onclick="visitContext()">
      <img class="asset-img" src="images/r3_librarian.png" alt="Librarian">
      <span class="glint" style="mask-image: url('images/r3_librarian.png')"></span>
      <div class="tool-tip">LIBRARIAN</div>
    </div>

  </div>
  <img class="ground" src="images/ground rooms.png" alt="">

  <script>
    window.CURRENT_ROOM = 3;

    const fade = document.getElementById("page-fade");

    window.addEventListener("pageshow", (event) => {
      if (event.persisted) {
        fade.style.transition = "none";
        fade.classList.remove("is-active");
        fade.offsetHeight;
        fade.style.transition = "";
        return;
      }
      setTimeout(() => { fade.classList.remove("is-active"); }, 100);
    });

    function fadeToPage(url) {
      sessionStorage.setItem("fade-transition", "true");
      fade.style.transition = "";
      fade.classList.add("is-active");
      setTimeout(() => { window.location.href = url; }, 500);
    }

    function back() { fadeToPage("index.html"); }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') fadeToPage('index.html');
    });
  </script>
  <script src="config.js"></script>
  <script src="context-menu.js"></script>
  <script src="nav.js"></script>
</body>
</html>
